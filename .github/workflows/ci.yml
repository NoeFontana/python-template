name: CI

on:
  push:
    branches: ["main"]
    # commitizen's tag_format is "$version", so release tags are bare semver.
    tags: ["[0-9]*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every job below invokes `just` recipes rather than restating the commands,
  # so the local gate and the CI gate cannot drift apart.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group test

      - name: Lint and type-check
        run: just lint

      - name: Run tests with coverage
        run: just test

      - name: Test documentation examples
        run: just docs-test

  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # Promoted out of pre-commit so it also gates PRs from forks, which do
      # not run the contributor's local hooks. Same recipe, same config.
      - name: codespell
        run: just spell

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git-revision-date-localized needs history to date the pages.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      # The generated reference pages are committed. Regenerate them and fail
      # if the result differs from what the PR carries.
      - name: Check generated pages are current
        run: |
          just docs-index
          git diff --exit-code -- docs/reference/

      # This is the internal-link gate: validation.links.unrecognized_links is
      # set to warn, and --strict turns warnings into errors, so a broken link
      # on any published page fails here.
      #
      # There is deliberately no link checker on this path. It would only add
      # coverage of docs/adr/, docs/engineering/ and the root Markdown files,
      # which mkdocs does not build -- low-severity links, not worth a
      # third-party action on the job that gates every merge. link-check.yml
      # covers those, plus external URLs, on a weekly schedule.
      - name: Build documentation
        run: just docs-build

  # `mike` publishes by committing the built site to the gh-pages branch, so
  # this job needs `contents: write` and full history. It builds the site
  # itself; there is no Pages artifact to upload.
  deploy-docs:
    needs: build-docs
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # main publishes the `latest` alias.
      - name: Deploy latest
        if: github.ref == 'refs/heads/main'
        run: |
          uv run mike deploy --push --update-aliases main latest
          # Without a default, the site root has no index.html and 404s. A
          # freshly seeded project has no release tag, so `latest` is the only
          # sensible root until one exists; the release step below repoints
          # the root at `stable` once it does.
          if uv run mike list 2>/dev/null | grep -qw stable; then
            echo "stable exists; leaving the default alias alone"
          else
            uv run mike set-default --push latest
          fi

      # A release tag publishes <major>.<minor> plus the `stable` alias, so
      # patch releases overwrite within their minor (ADR-0002 §"Versioning").
      - name: Deploy release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME}"
          minor="${version%.*}"
          uv run mike deploy --push --update-aliases "$minor" stable
          uv run mike set-default --push stable
